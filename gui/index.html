<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanoodle Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🧩 Kanoodle Solver</h1>
        
        <div class="controls">
            <button id="solve-btn">Solve Puzzle</button>
            <button id="clear-btn">Clear Board</button>
            <button id="new-puzzle-btn">New Puzzle</button>
        </div>

        <div class="main-content">
            <div class="piece-library">
                <h3>Puzzle Pieces</h3>
                
                <!-- Rotation Controls -->
                <div id="rotation-controls" class="rotation-controls hidden">
                    <h4>🔧 Selected Piece Controls</h4>
                    <div class="rotation-buttons">
                        <button id="rotate-left-btn" title="Rotate 90° Left">↶ Rotate Left</button>
                        <button id="rotate-right-btn" title="Rotate 90° Right">↷ Rotate Right</button>
                        <button id="flip-horizontal-btn" title="Flip Horizontally">↔ Flip H</button>
                        <button id="flip-vertical-btn" title="Flip Vertically">↕ Flip V</button>
                        <button id="reset-piece-btn" title="Reset to Original">⟲ Reset</button>
                    </div>
                    <div id="selected-piece-preview">
                        <p>Select a piece to see preview</p>
                    </div>
                </div>
                
                <div id="pieces-container"></div>
            </div>
            
            <div class="puzzle-board">
                <h3>Puzzle Board</h3>
                <div id="board-grid"></div>
            </div>
        </div>

        <div id="solution-display" class="solution hidden">
            <h3>Solution Found!</h3>
            <div id="solution-steps"></div>
            <button id="apply-solution-btn">Apply Solution</button>
            <button id="close-solution-btn">Close</button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Solving puzzle...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
